<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arma tú PC</title>
    <link rel="stylesheet" href="CSS/pages/buildpc.css">
    <link rel="icon" href="img/wlogo.svg" type="image/svg+xml">
</head>
<body>
    <header>
        <div class="barra-ventana">
            <div class="marca">
                <img src="img/wlogo.svg" alt="" class="wlogo" width="25px">
                <span>PC Forgery</span>
            </div>
        <div class="botones-windows">
                <button>_</button>
                <button>□</button>
                <button>×</button>
            </div>
        </div>
        <button class="boton-menu" id="boton-menu">
            ☰ Menú
        </button>
        <nav id="menu-navegacion">
            <a href="index.html">Inicio</a>
            <a href="tienda.html">Tienda</a>
            <a href="build_your_own_pc.html">Arma tu PC</a>
            <a href="nosotros.html">Quiénes somos</a>
            <a href="contacto.html">Contacto</a>
            <a href="login.html">Login</a>
        </nav>
    </header>
    <main class="wizard-container">
    <!-- Ventana Principal del Asistente -->
        <section class="window wizard-window">
            <div class="barra-ventana">
                <img src="img/wlogo.svg" alt="" class="wlogo" width="25px">
                <span>Sobre nosotros</span>
                <div class="botones-windows">
                    <button class="boton-colapsar">-</button>
                </div>
            </div>

            <!-- CONTENEDOR REQUERIDO POR JS/ventanas.js -->
            <div class="contenido-ventana">
                <!-- Barra superior de pestañas/pasos -->
                <nav class="wizard-steps" id="wizard-steps">
                    <!-- se llena dinámicamente con JS -->
                </nav>

                <div class="wizard-content">
                    <!-- Mensaje de Clippy con feedback de estado -->
                    <div class="clippy-helper">
                        <img src="img/help.png" alt="Clippy" class="clippy-img">
                        <div class="clippy-dialog" id="clippy-msg">
                            ¡Hola! Selecciona una plataforma para comenzar a armar tu equipo.
                        </div>
                    </div>

                    <!-- Grilla donde se renderizan los productos de cada categoría -->
                    <div id="grid-productos" class="grid-productos">
                        <!-- Se inyecta por JS -->
                    </div>
                </div>

                <!-- Controles de navegación -->
                <div class="wizard-actions">
                    <button id="btn-prev" class="btn-retro" disabled>&laquo; Anterior</button>
                    <button id="btn-next" class="btn-retro">Siguiente &raquo;</button>
                </div>
            </div>
        </section>

    <!-- Barra lateral de Resumen y Validación (RF-07, RF-08) -->
    <aside class="window summary-window">
        <div class="window-header">
            <span class="window-title">Resumen de Construcción</span>
        </div>
        <div class="summary-body">
            <ul class="summary-list" id="summary-list">
                <!-- Items elegidos -->
            </ul>

            <div class="compatibility-box" id="compat-box">
                <div class="compat-indicator" id="compat-indicator"></div>
                <span id="compat-text">Estado: Sin componentes seleccionados</span>
            </div>

            <div class="summary-total">
                <span>Total Estimado:</span>
                <strong id="total-price">$0</strong>
            </div>

            <div class="summary-buttons">
                <button id="btn-reset" class="btn-retro">Reiniciar</button>
                <button id="btn-add-cart" class="btn-retro btn-primary">Agregar al Carrito</button>
            </div>
        </div>
    </aside>
</main>
    <footer>
        Información de la empresa aquí.
    </footer>
<script src="JS/nav.js"></script>
<script src="JS/ventanas.js"></script>
<script src="JS/componentesData.js"></script>
<script src="JS/buildpc.js"></script>
        
</body>
</html>
