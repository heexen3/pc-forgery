<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arma tú PC</title>
    <link rel="stylesheet" href="CSS/pages/buildpc.css">
    <link rel="icon" href="img/wlogo.svg" type="image/svg+xml">
</head>
<body>
    <header>
        <div class="barra-ventana">
            <div class="marca">
                <img src="img/wlogo.svg" alt="" class="wlogo" width="25px">
                <span>PC Forgery</span>
            </div>
        <div class="botones-windows">
                <button>_</button>
                <button>□</button>
                <button>×</button>
            </div>
        </div>
        <button class="boton-menu" id="boton-menu">
            ☰ Menú
        </button>
        <nav id="menu-navegacion">
            <a href="index.html">Inicio</a>
            <a href="tienda.html">Tienda</a>
            <a href="build_your_own_pc.html">Arma tu PC</a>
            <a href="comunidad.html">Comunidad</a>
            <a href="noticias.html">Noticias</a>
            <a href="nosotros.html">Quiénes somos</a>
            <a href="contacto.html">Contacto</a>
            <!-- Usuario no logueado -->
            <a href="login.html" id="login-link">Login</a>
                
            <!-- Usuario normal logueado -->
            <a href="usuario.html" id="usuario-link" style="display: none;">Usuario</a>
            
                
            <!-- Administrador -->
            <a href="admin.html" id="admin-link" style="display: none;">Admin</a>
            <a href="historial.html" id="admin-historial-link" style="display: none;">Ver Historial</a>
            <a href="#" id="logout-link" style="display: none;">Cerrar sesión</a>
        </nav>
    </header>
    <main>
        <section class="contenedor-wizard">
            <nav class="pasos-armador" id="pasos-armador">
                <!-- pasos: fabricante, cpu, placa, etc.. -->
            </nav>

            <div class="opciones-paso" id="opciones-paso">
                <!-- JS inyecta tarjetas del paso actual -->
            </div>
            
            <div class="botones-armador">
                <button id="btn-anterior">Anterior</button>
                <button id="btn-siguiente">Siguiente</button>
            </div>
        </section>
        
        <aside class="resumen">
            <h2>Resumen de tu PC</h2>
            <ul class="lista-seleccion" id="lista-seleccion">
                <!-- JS va a inyectar aquí <li> por cada componente elegido -->
            </ul>

            <p class="precio-total">
                Total: <strong id="precio-total">$0</strong>
            </p>
        </aside>

    </main>
    <footer>
        Información de la empresa aquí.
    </footer>
<script src="JS/nav.js"></script>
<script src="JS/buildpc.js"></script>
        
</body>
</html>
