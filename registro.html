<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="CSS/pages/registro.css">
    <link rel="icon" href="img/wlogo.svg" type="image/svg+xml">
</head>
<body>
    <header>
        <div class="barra-ventana">
            <div class="marca">
            <img src="img/wlogo.svg" alt="" class="wlogo" width="25px">
            <span>PC Forgery</span>
        </div>
        <div class="botones-windows">
                <button>_</button>
                <button>□</button>
                <button>×</button>
            </div>
        </div>
        <button class="boton-menu" id="boton-menu">
            ☰ Menú
        </button>
        <nav id="menu-navegacion">
            <a href="index.html">Inicio</a>
            <a href="tienda.html">Tienda</a>
            <a href="build_your_own_pc.html">Arma tu PC</a>
            <a href="nosotros.html">Quiénes somos</a>
            <a href="contacto.html">Contacto</a>
            <!-- Usuario no logueado -->
            <a href="login.html" id="login-link">Login</a>
                
            <!-- Usuario normal logueado -->
            <a href="usuario.html" id="usuario-link" style="display: none;">Usuario</a>
            
                
            <!-- Administrador -->
            <a href="admin.html" id="admin-link" style="display: none;">Admin</a>
            <a href="historial.html" id="admin-historial-link" style="display: none;">Ver Historial</a>
            <a href="#" id="logout-link" style="display: none;">Cerrar sesión</a>
        </nav>
    </header>
    <main>
        <section class="formulario-registro">
            <h1>Registrarse</h1>
            <form onsubmit="return validacionRegistro()">
                <!-- Nombre de usuario -->
            <label for="usuario">Nombre de Usuario:</label>
            <input type="text" id="usuario" name="usuario" minlength="3" required placeholder="john_doe">
                <!-- Correo Electrónico -->
            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="email" required placeholder="john.doe@example.com">
                <!-- contraseña y confirmación de contraseña -->
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" minlength="6" required placeholder="password">
            <label for="confirm_password">Confirmar Contraseña:</label>
            <input type="password" id="confirm_password" name="confirm_password" required placeholder="password confirmation">
                <!-- Botón de registro -->
            <button type="submit">Registrarse</button>

        </form>

        <p class="registro">
            ¿Tienes una cuenta?
            <a href="login.html">Iniciar sesión</a>
        </p>
        </section>
    </main>
    <footer>
        Información de la empresa aquí.
    </footer>
    <!-- menú -->
    <script src="JS/nav.js"></script>
    <!-- logs -->
     <script src="JS/logs.js"></script>
    <!-- registro -->
    <script src="JS/registro.js"></script>
</body>
</html>
